name: shellcheck

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check POSIX shell syntax
        run: sh -n cf-keyword-watch.sh

      - name: Run shellcheck
        run: shellcheck --shell=sh cf-keyword-watch.sh
